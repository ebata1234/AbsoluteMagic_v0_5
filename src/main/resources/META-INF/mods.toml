[[mods]]
modId = "absolutemagic"
version = "0.5.0"
displayName = "Absolute Magic"
description = '''Adds "Fixed Strike", "Percent Strike" and "Time Bomb" spells for Iron's Spells 'n Spellbooks.
Fixed / Percent Strike: while the buff is active, every tool hit / spell hit also deals a flat amount or a percentage of the target's HP as true damage that ignores armor, resistances and other damage buffs.
Magician trait (L2Hostility): mobs with the trait cast Iron's Spells spells.
Time Bomb: target a creature; after the fuse it explodes (no block damage). A player dies, a mob takes fixed damage. A bombed player who hits another player passes the bomb on.'''

